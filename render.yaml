# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Render asks for the `sync: false` values on first deploy.
services:
  - type: web
    name: climaguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free: spins down after ~15 idle minutes, 512 MB RAM, no disk (accounts
    # reset on every restart/redeploy; ADMIN_* recreates the admin).
    # For accounts that persist, switch to `starter` and uncomment `disk`.
    plan: free
    # Answers without loading models, data or live weather.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Stay inside 512 MB: one OpenMP thread (xgboost / numpy) and at most two
      # glibc malloc arenas for gunicorn's four threads.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Read access to the private DagsHub DVC remote (used only at build time).
      - key: DAGSHUB_USER
        sync: false
      - key: DAGSHUB_TOKEN
        sync: false
      # First admin, created at startup if missing (see wsgi.py).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # disk:
    #   name: climaguard-db
    #   mountPath: /app/instance
    #   sizeGB: 1
