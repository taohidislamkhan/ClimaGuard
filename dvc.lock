      hash: md5
      md5: 1cb26388dacb70d8ff67f9c22152a5d0
      size: 1694
    params:
      params.yaml:
        prepare:
          non_negative_cols:
          - air_quality_index
          - pm25_ugm3
          - respiratory_disease_rate
          - cardio_mortality_rate
          - vector_disease_risk_score
          - waterborne_disease_incidents
          - heat_related_admissions
          - heat_wave_days
          - extreme_weather_events
          - precipitation_mm
          binary_cols:
          - drought_indicator
          - flood_indicator
          index_0_100_cols:
          - healthcare_access_index
          - mental_health_index
          - food_security_index
          dedup_keys:
          - country_code
          - year
          - week
    outs:
    - path: data/interim/clean.parquet
      hash: md5
      md5: 091b30ea1af2487076a469373f9948fe
      size: 421251
    - path: reports/metrics/data_quality.json
      hash: md5
      md5: 63e0d3f51702cfa5084a1e0517172352
      size: 893
  featurize:
