      hash: md5
      md5: 6fa16a4ddc0a1962372b90e0b00564c1
      size: 1008
    params:
      params.yaml:
        featurize:
          roll_cols:
          - temperature_celsius
          - pm25_ugm3
          - air_quality_index
          - precipitation_mm
          - heat_wave_days
          - extreme_weather_events
          - waterborne_disease_incidents
          lag_cols:
          - temperature_celsius
          - pm25_ugm3
          - air_quality_index
          - precipitation_mm
          - heat_wave_days
          - extreme_weather_events
          - waterborne_disease_incidents
          - heat_related_admissions
          rolling_windows:
          - 4
          - 8
          - 12
          lags:
          - 1
          - 2
          - 4
          - 8
          interactions:
          - - temperature_celsius
            - pm25_ugm3
            - temp_x_pm25
          - - precipitation_mm
            - temperature_celsius
            - rain_x_temp
          - - pm25_ugm3
            - air_quality_index
            - pm25_x_aqi
          categorical:
          - country_code
          - region
          - income_level
          - climate_zone
        label:
          train_end_year: 2023
          composite_cols:
          - heat_related_admissions
          - respiratory_disease_rate
          - cardio_mortality_rate
          - vector_disease_risk_score
          - waterborne_disease_incidents
          - pm25_ugm3
          - temperature_celsius
    outs:
    - path: data/processed/features.parquet
      hash: md5
      md5: 9afd9709876e878bab0356a2fd050652
      size: 3517426
    - path: reports/metrics/featurize.json
      hash: md5
      md5: bb53d569feb03b2410d5f0349e435db7
